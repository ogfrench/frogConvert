<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>frogConvert Docs</title>
  <meta name="description" content="Documentation for frogConvert — fast, private in-browser file conversion.">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">

  <script>
    var t = localStorage.getItem("theme");
    if (t === "dark" || (!t && !window.matchMedia("(prefers-color-scheme: light)").matches)) {
      document.documentElement.classList.add("dark");
    }
    document.documentElement.style.visibility = 'hidden';
    document.documentElement.style.opacity = '0';
    document.documentElement.style.transition = 'opacity 0.25s ease';
    window.addEventListener('DOMContentLoaded', function () {
      document.documentElement.style.visibility = 'visible';
      document.documentElement.style.opacity = '1';
    });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    as="style">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"
    media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  </noscript>

  <link rel="stylesheet" href="../src/styles/global.css">

  <!-- marked + highlight.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljs-light">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljs-dark"
    disabled>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --topbar-h: 64px;
      --sidebar-w: 240px;
    }

    /* ── Top Bar ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-4) var(--space-6);
      background-color: var(--top-bar-bg);
      backdrop-filter: var(--blur-bg-visual);
      -webkit-backdrop-filter: var(--blur-bg-visual);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      transition: background-color .3s ease, border-color .3s ease;
    }

    #topbar-left { display: flex; align-items: center; gap: var(--space-3); }

    #logo {
      display: flex; align-items: center; gap: var(--space-1-5);
      text-decoration: none; color: var(--foreground);
      font-weight: var(--font-bold); font-size: var(--text-xl);
      transition: opacity .15s ease;
    }
    #logo:hover { opacity: var(--opacity-hover); }

    .logo-emoji { font-size: var(--text-xl); line-height: 1; transition: transform .2s ease; }
    .frog-emoji-img { height: 1.1em; width: auto; display: block; }
    #logo:hover .logo-emoji { transform: scale(1.1) rotate(5deg); }

    .docs-badge {
      font-size: var(--text-xs); font-weight: var(--font-semibold);
      letter-spacing: var(--tracking-wider); text-transform: uppercase;
      padding: var(--space-1) var(--space-2-5);
      background-color: var(--secondary);
      color: var(--muted-foreground);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
    }

    #topbar-right { display: flex; align-items: center; gap: var(--space-2); }

    .topbar-btn {
      display: flex; align-items: center; gap: var(--space-1-5);
      height: 2rem; padding: 0 var(--space-3);
      font-family: inherit; font-size: var(--text-sm); font-weight: var(--font-medium);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background-color: var(--secondary);
      color: var(--foreground);
      cursor: pointer; text-decoration: none;
      transition: background-color .15s ease, border-color .15s ease;
    }
    .topbar-btn:hover { background-color: var(--accent); border-color: var(--ring); }

    #theme-toggle {
      width: 2rem; height: 2rem; padding: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-xl);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background-color: var(--secondary);
      color: var(--foreground);
      cursor: pointer;
      transition: background-color .15s ease;
    }
    #theme-toggle:hover { background-color: var(--accent); }

    /* ── Mobile nav toggle ── */
    #nav-toggle {
      display: none;
      width: 2rem; height: 2rem; padding: 0;
      flex-direction: column; justify-content: center; align-items: center; gap: var(--space-1);
      border: 1px solid var(--border); border-radius: var(--radius);
      background-color: var(--secondary); cursor: pointer;
      transition: background-color .15s ease;
    }
    #nav-toggle:hover { background-color: var(--accent); }
    #nav-toggle span {
      width: 14px; height: 1.5px;
      background-color: var(--foreground); border-radius: 2px;
      transition: transform .25s ease, opacity .25s ease;
    }

    /* ── Layout ── */
    #layout {
      display: flex;
      padding-top: var(--topbar-h);
      min-height: 100vh;
      background-color: var(--background);
    }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed;
      top: var(--topbar-h); bottom: 0; left: 0;
      width: var(--sidebar-w);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--border);
      background-color: var(--background);
      transition: background-color .3s ease, border-color .3s ease, transform .25s ease;
      z-index: 50;
    }

    #sidebar-items {
      display: flex;
      flex-direction: column;
      padding: var(--space-4) 0;
    }

    #sidebar-footer {
      padding: var(--space-8) var(--space-5) var(--space-4);
      opacity: 0.6;
      font-size: var(--text-xs);
      color: var(--muted-foreground);
      line-height: var(--leading-normal);
    }

    #sidebar-footer-label {
      font-weight: var(--font-semibold);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wider);
      margin-bottom: var(--space-1-5);
    }

    #build-sha {
      font-family: var(--font-mono);
      margin-top: var(--space-1);
    }

    #commit-link {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px dashed var(--muted-foreground);
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    #commit-link.disabled {
      border-bottom: none;
      cursor: default;
    }

    .sidebar-section-label {
      padding: 0 var(--space-5) var(--space-2);
      font-size: var(--text-xs); font-weight: var(--font-semibold);
      letter-spacing: var(--tracking-wider); text-transform: uppercase;
      color: var(--muted-foreground);
    }

    .nav-item {
      display: flex; align-items: center; gap: var(--space-3);
      width: 100%; padding: var(--space-3) var(--space-5);
      font-family: inherit; font-size: var(--text-base); font-weight: var(--font-medium);
      color: var(--muted-foreground);
      background: none; border: none; cursor: pointer; text-align: left;
      border-radius: 0;
      transition: color .15s ease, background-color .15s ease;
      text-decoration: none;
      position: relative;
    }
    .nav-item:hover { color: var(--foreground); background-color: var(--secondary); }
    .nav-item.active {
      color: var(--foreground); font-weight: var(--font-semibold);
      background-color: var(--accent);
    }
    .nav-item.active::before {
      content: "";
      position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 2px; border-radius: 2px;
      background-color: var(--primary);
    }
    .nav-icon { font-size: 1.15rem; flex-shrink: 0; line-height: 1; }
    .nav-desc {
      display: block; margin-top: 1px;
      font-size: var(--text-xs); font-weight: var(--font-normal);
      color: var(--muted-foreground); opacity: .7;
    }

    /* ── Content Area ── */
    #content {
      flex: 1;
      margin-left: var(--sidebar-w);
      padding: var(--space-8) var(--space-12) var(--space-16);
      max-width: 1200px;
      min-width: 0;
    }

    /* ── Loading / Error state ── */
    #doc-placeholder {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 40vh;
      color: var(--muted-foreground);
      font-size: var(--text-md); gap: var(--space-3);
    }

    /* ── Rendered Markdown ── */
    #doc-body {
      font-size: var(--text-lg);
      line-height: var(--leading-relaxed);
      color: var(--foreground);
    }

    #doc-body h1 {
      font-size: var(--text-3xl); font-weight: var(--font-bold);
      margin-top: 0;
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--border);
    }

    #doc-body h2 {
      font-size: var(--text-2xl); font-weight: var(--font-bold);
      margin-top: var(--space-12); margin-bottom: var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--border);
    }

    #doc-body h3 {
      font-size: var(--text-xl); font-weight: var(--font-semibold);
      margin: var(--space-7) 0 var(--space-2);
      color: var(--foreground);
    }

    #doc-body h4 {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      margin: var(--space-5) 0 var(--space-1);
    }

    #doc-body p,
    #doc-body ul,
    #doc-body ol,
    #doc-body pre,
    #doc-body blockquote,
    #doc-body table {
      max-width: 680px;
    }

    #doc-body h1,
    #doc-body h2,
    #doc-body h3,
    #doc-body hr {
      max-width: none;
    }

    #doc-body p {
      margin: var(--space-3-5) 0;
    }

    #doc-body ul,
    #doc-body ol {
      padding-left: var(--space-6);
      margin: var(--space-3) 0;
    }

    #doc-body li {
      margin: var(--space-1) 0;
    }

    #doc-body li>ul,
    #doc-body li>ol {
      margin: var(--space-1) 0;
    }

    #doc-body a {
      color: var(--foreground);
      text-decoration: underline;
      text-decoration-color: var(--border);
      text-underline-offset: 2px;
      transition: text-decoration-color .15s ease;
    }

    #doc-body a:hover {
      text-decoration-color: var(--foreground);
    }

    #doc-body strong {
      font-weight: var(--font-semibold);
    }

    #doc-body em {
      font-style: italic;
    }

    #doc-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: var(--space-8) 0;
    }

    #doc-body blockquote {
      margin: var(--space-4) 0;
      padding: var(--space-3) var(--space-4);
      border-left: 3px solid var(--border);
      background-color: var(--secondary);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--muted-foreground);
    }

    #doc-body blockquote p {
      margin: 0;
    }

    /* Inline code */
    #doc-body :not(pre)>code {
      font-family: var(--font-mono);
      font-size: var(--text-base);
      padding: .15em .4em;
      background-color: var(--secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--foreground);
    }

    /* Code blocks */
    #doc-body pre {
      margin: var(--space-5) 0;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    #doc-body pre code {
      display: block;
      padding: var(--space-4) var(--space-5) !important;
      font-family: var(--font-mono) !important;
      font-size: var(--text-base) !important;
      line-height: var(--leading-normal) !important;
      overflow-x: auto;
      background: transparent !important;
      border: none !important;
    }

    /* Wrap hljs backgrounds into border */
    #doc-body pre>.hljs {
      border-radius: calc(var(--radius) - 1px);
    }

    /* Tables */
    #doc-body table {
      width: 100%; border-collapse: collapse;
      font-size: var(--text-md); margin: var(--space-6) 0;
    }
    #doc-body th {
      padding: var(--space-2-5) var(--space-3); text-align: left;
      font-weight: var(--font-semibold); font-size: var(--text-xs);
      letter-spacing: var(--tracking-wider); text-transform: uppercase;
      color: var(--muted-foreground);
      border-bottom: 2px solid var(--border);
    }
    #doc-body td {
      padding: var(--space-3);
      border-bottom: 1px solid var(--border);
      font-size: var(--text-base);
    }
    #doc-body tr:last-child td { border-bottom: none; }
    #doc-body tr:hover td { background-color: var(--secondary); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      :root {
        --sidebar-w: 0px;
      }

      #topbar { padding: var(--space-4) var(--space-6); }
      #topbar-right { gap: var(--space-2); }
      .logo-text { display: none; }
      .logo-emoji { font-size: var(--text-3xl); }

      #sidebar {
        width: 240px;
        transform: translateX(-100%);
        box-shadow: var(--shadow-md);
      }
      #sidebar.open { transform: translateX(0); }
      #nav-toggle { display: flex; }

      #content {
        margin-left: 0;
        padding: var(--space-8) var(--space-6) var(--space-12);
      }

      #doc-body h1 {
        padding-bottom: 0;
      }
      #doc-body h2 { font-size: var(--text-xl); }
    }

    @media (max-width: 480px) {
      #topbar { padding: var(--space-4) var(--space-4); }
      #topbar-right a.topbar-btn[href*="github"] { display: none; }
      #content { padding: var(--space-6) var(--space-4) var(--space-12); }
    }

    /* Overlay for mobile sidebar */
    #sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: var(--overlay-bg);
      z-index: 49;
    }

    #sidebar-overlay.visible {
      display: block;
    }
  </style>
</head>

<body>

  <!-- Top Bar -->
  <header id="topbar">
    <div id="topbar-left">
      <button id="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <a id="logo" href="../" class="clickable" aria-label="frogConvert home">
        <span class="logo-emoji" aria-hidden="true"><img src="../frog-emoji.webp" alt="" class="frog-emoji-img"></span>
        <span class="logo-text">frogConvert</span>
      </a>
      <span class="docs-badge">Docs</span>
    </div>
    <div id="topbar-right">
      <a class="topbar-btn" href="../">
        ← App
      </a>
      <a class="topbar-btn" href="https://github.com/ogfrench/frogConvert" target="_blank" rel="noopener"
        aria-label="GitHub repository">
        GitHub
      </a>
      <button id="theme-toggle" aria-label="Toggle theme">&#9790;</button>
    </div>
  </header>

  <div id="sidebar-overlay"></div>

  <div id="layout">
    <!-- Sidebar -->
    <nav id="sidebar" aria-label="Documentation navigation">
      <div id="sidebar-items">
        <div class="sidebar-section-label">Documentation</div>

        <button class="nav-item" data-doc="README.md">
          <span class="nav-icon">📖</span>
          <span>
            README
            <span class="nav-desc">Setup &amp; contributing</span>
          </span>
        </button>

        <button class="nav-item" data-doc="AGENTS.md">
          <span class="nav-icon">🤖</span>
          <span>
            AGENTS
            <span class="nav-desc">MCP &amp; REST API guide</span>
          </span>
        </button>

        <button class="nav-item" data-doc="AGENT_CONTEXT.md">
          <span class="nav-icon">⚙️</span>
          <span>
            Agent Context
            <span class="nav-desc">Architecture deep-dive</span>
          </span>
        </button>
      </div>

      <div id="sidebar-footer">
        <div id="sidebar-footer-label">Build Info</div>
        <div id="build-time">...</div>
        <div id="build-sha">
          <a id="commit-link" href="#" target="_blank" rel="noopener">...</a>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main id="content">
      <div id="doc-placeholder">
        <div class="loader-spinner"></div>
        <span>Loading…</span>
      </div>
      <div id="doc-body" style="display:none"></div>
    </main>
  </div>

  <script type="module">
    import { initCustomCursor } from "../src/components/index.ts";

    // --- Custom Cursor ---
    initCustomCursor();

    // ── Theme ──
    const html = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle');
    function isDark() { return html.classList.contains('dark'); }
    function applyTheme(dark) {
      html.classList.toggle('dark', dark);
      themeBtn.innerHTML = dark ? '&#9788;' : '&#9790;';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      document.getElementById('hljs-light').disabled = dark;
      document.getElementById('hljs-dark').disabled = !dark;
    }
    applyTheme(isDark());
    themeBtn.addEventListener('click', () => applyTheme(!isDark()));

    // ── Sidebar toggle (mobile) ──
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const navToggle = document.getElementById('nav-toggle');
    function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('visible'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('visible'); }
    navToggle.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
    overlay.addEventListener('click', closeSidebar);

    marked.setOptions({ gfm: true, breaks: false });

    // ── Doc loader ──
    const placeholder = document.getElementById('doc-placeholder');
    const docBody = document.getElementById('doc-body');
    let activeBtn = null;

    async function loadDoc(filename) {
      // Update nav active state
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      const btn = document.querySelector(`[data-doc="${filename}"]`);
      if (btn) btn.classList.add('active');
      activeBtn = filename;

      // Show loading
      placeholder.innerHTML = '<div class="loader-spinner"></div><span>Loading…</span>';
      placeholder.style.display = 'flex';
      docBody.style.display = 'none';

      try {
        const res = await fetch(`./${filename}`);
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        const md = await res.text();
        const html = await marked.parse(md);
        docBody.innerHTML = html;

        // Open external links in new tab
        docBody.querySelectorAll('a[href^="http://"], a[href^="https://"]').forEach(a => {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener');
        });

        // Syntax highlight
        if (window.hljs) {
          docBody.querySelectorAll('pre code').forEach(el => {
            hljs.highlightElement(el);
          });
        }

        placeholder.style.display = 'none';
        docBody.style.display = 'block';
        window.scrollTo({ top: 0 });

        // Update URL hash
        history.replaceState(null, '', `#${filename}`);
      } catch (err) {
        placeholder.innerHTML = `<span>⚠️ Failed to load ${filename}</span><span style="font-size:var(--text-xs);color:var(--muted-foreground)">${err.message}</span>`;
      }

      // Auto-close sidebar on mobile
      if (window.innerWidth <= 768) closeSidebar();
    }

    // Wire up nav buttons
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => loadDoc(btn.dataset.doc));
    });

    // Load build info
    const buildTimeEl = document.getElementById('build-time');
    const buildShaEl = document.getElementById('build-sha');
    const appName = import.meta.env.VITE_APP_NAME || 'frogConvert';
    const buildTime = import.meta.env.VITE_BUILD_TIME;
    const commitSha = import.meta.env.VITE_COMMIT_SHA || 'dev';

    document.title = `${appName} Docs`;
    document.querySelectorAll('.logo-text').forEach(el => el.textContent = appName);

    if (buildTimeEl && buildTime) {
      const date = new Date(buildTime);
      buildTimeEl.textContent = date.toLocaleString();
    }
    if (buildShaEl) {
      const sha = commitSha.substring(0, 7);
      const link = document.getElementById('commit-link');
      if (link) {
        link.textContent = sha;
        if (commitSha !== 'dev') {
          link.href = `https://github.com/ogfrench/frogConvert/commit/${commitSha}`;
        } else {
          link.classList.add('disabled');
          link.onclick = (e) => e.preventDefault();
        }
      }
    }

    // Load doc from hash or default to README
    const hash = location.hash.replace('#', '');
    const validDocs = ['README.md', 'AGENTS.md', 'AGENT_CONTEXT.md'];
    loadDoc(validDocs.includes(hash) ? hash : 'README.md');
  </script>
</body>

</html>
