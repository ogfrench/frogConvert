<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>frogConvert Docs</title>
  <meta name="description" content="Documentation for frogConvert - private in-browser file conversion, compression and PDF editing.">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="frogConvert">
  <meta name="mobile-web-app-capable" content="yes">

  <script>
    var t = localStorage.getItem("theme");
    if (t === "dark" || (!t && !window.matchMedia("(prefers-color-scheme: light)").matches)) {
      document.documentElement.classList.add("dark");
    }
    document.documentElement.style.visibility = 'hidden';
    document.documentElement.style.opacity = '0';
    document.documentElement.style.transition = 'opacity 0.25s ease';
    window.addEventListener('DOMContentLoaded', function () {
      document.documentElement.style.visibility = 'visible';
      document.documentElement.style.opacity = '1';
    });
  </script>

  <!-- Inter is self-hosted via @fontsource-variable/inter (src/styles/global.css).
       System-font fallback chain covers any load failure. No font CDN. -->

  <link rel="stylesheet" href="../src/styles/global.css">
  <link rel="stylesheet" href="../src/styles/docs.css">
</head>

<body>

  <!-- Top Bar -->
  <header id="topbar">
    <div id="topbar-left">
      <button id="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <a id="logo" href="../" class="clickable" aria-label="frogConvert home">
        <span class="logo-emoji" aria-hidden="true"><img src="../frog-emoji.webp" alt="" class="frog-emoji-img"></span>
        <span class="logo-text">frogConvert</span>
      </a>
      <span class="docs-badge">Docs</span>
    </div>
    <div id="topbar-right">
      <a class="topbar-btn" href="../">
        ← App
      </a>
      <a class="topbar-btn" href="./slidedeck.html" aria-label="Slide deck">
        Deck
      </a>
      <a class="topbar-btn" href="https://github.com/ogfrench/frogConvert" target="_blank" rel="noopener"
        aria-label="GitHub repository">
        GitHub
      </a>
      <button id="theme-toggle" aria-label="Toggle theme">&#9790;</button>
    </div>
  </header>

  <div id="sidebar-overlay"></div>

  <div id="layout">
    <!-- Sidebar -->
    <nav id="sidebar" aria-label="Documentation navigation">
      <div id="sidebar-items">
        <!-- Nav items injected by docs.ts from NAV_DOCS -->
      </div>

      <div id="sidebar-footer">
        <div id="sidebar-footer-label">Build Info</div>
        <div id="build-time">...</div>
        <div id="build-sha">
          <a id="commit-link" href="#" target="_blank" rel="noopener">...</a>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main id="content">
      <div id="doc-placeholder">
        <div class="loader-spinner"></div>
        <span>Loading…</span>
      </div>
      <div id="doc-body" style="display:none"></div>
    </main>

    <!-- On this page -->
    <aside id="toc" class="toc-empty">
      <div id="toc-title">On this page</div>
      <nav id="toc-list"></nav>
    </aside>
  </div>

  <script type="module" src="../src/docs/docs.ts"></script>
</body>

</html>
