<!DOCTYPE html>
<!--
  Vite MPA entry for the headless build. Served at /headless/ so that the
  Puppeteer browser bridge (src/mcp/core/browserBridge.ts) can load the full
  handler runtime from the same origin as /wasm/ assets. Module source lives
  at src/headless/index.ts.
-->
<html>
<head>
  <meta charset="UTF-8" />
  <title>frogConvert headless</title>
  <!-- Machine-only surface: the Puppeteer bridge in src/mcp/core/browserBridge.ts
       loads this to reach browser-only handlers. Nothing here is for a reader. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script type="module" src="../src/headless/index.ts"></script>
</head>
<body></body>
</html>
