# Scan dependency and CI workflow changes, not unrelated application edits.
# Socket runs as a GitHub App; no additional GitHub Actions job is required.
version: 2

triggerPaths:
  - "package.json"
  - "package-lock.json"
  - "npm-shrinkwrap.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "bun.lock"
  - "bun.lockb"
  - "Pipfile"
  - "Pipfile.lock"
  - "pyproject.toml"
  - "poetry.lock"
  - "uv.lock"
  - "requirements*.txt"
  - "go.mod"
  - "go.sum"
  - "Cargo.toml"
  - "Cargo.lock"
  - "Gemfile"
  - "Gemfile.lock"
  - ".github/workflows"
  - "socket.yml"

githubApp:
  enabled: true
  pullRequestAlertsEnabled: true
  projectReportsEnabled: true
