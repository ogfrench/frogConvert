name: CI

on:
  push:
    branches: ["master"]
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Build
        run: |
          export VITE_COMMIT_SHA=${{ github.sha }}
          bun run build

      - name: Generate cache
        run: bun run cache:build

      # Enforced: a file nothing imports is dead weight, and the check is
      # unambiguous, so this one fails the build. It was advisory for its whole
      # life, which is how `src/core/index.ts` and `tarCompressed/xz.ts` sat
      # unreferenced, and how four pieces of dead code accumulated in a single
      # 1,000-line component without anyone hearing about it.
      - name: Dead files
        run: bun x knip --include files

      # Advisory, for now. The remaining categories are real but noisy - 30
      # unused exports, and dependencies that resolve transitively rather than
      # being declared. Clearing them means touching package.json and the
      # lockfile, which is not a thing to do next to a release. Tracked, with
      # the full list, rather than left invisible.
      - name: Unused exports & dependencies (advisory)
        run: bun x knip --no-exit-code

      - name: Run tests
        run: bun run test
