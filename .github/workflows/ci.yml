name: CI

on:
  push:
    branches: ["master"]
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
          cache: true

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Build
        run: |
          export VITE_COMMIT_SHA=${{ github.sha }}
          bun run build

      - name: Generate cache
        run: bun run cache:build

      - name: Run tests
        run: bun run test
