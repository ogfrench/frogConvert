name: CI

on:
  push:
    branches: ["master"]
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Build
        run: |
          export VITE_COMMIT_SHA=${{ github.sha }}
          bun run build

      - name: Generate cache
        run: bun run cache:build

      # Enforced: a file nothing imports is dead weight, and a dependency that
      # only resolves transitively is one lockfile change away from a broken
      # build. Both checks are unambiguous, so this one fails the build. Files
      # was advisory for its whole life, which is how `src/core/index.ts` and
      # `tarCompressed/xz.ts` sat unreferenced, and how four pieces of dead
      # code accumulated in a single 1,000-line component without anyone
      # hearing about it. Unlisted moved here once the 9 packages that were
      # only resolving transitively got declared for real.
      - name: Dead files & unlisted dependencies
        run: bun x knip --include files,unlisted

      # Advisory, for now. The remaining categories are real but noisy - 30
      # unused exports. Clearing them means touching source across many
      # files, which is not a thing to do next to a release. Tracked, with
      # the full list, rather than left invisible.
      - name: Unused exports (advisory)
        run: bun x knip --no-exit-code

      - name: Run tests
        run: bun run test

      # The only test that drives a real service worker through a real deploy.
      # It is opt-in because inside the default run it builds and drives a
      # browser in a worker parallel with everything else, and that contention
      # once pushed the MCP suite past its 60s timeout. Run here instead:
      # serially, in a job that already has the submodules and dependencies it
      # needs. Not running it anywhere is how a service worker that could not
      # install shipped in 3.0.0 - unit tests cannot catch that, because the
      # failure is `precacheAndRoute` rejecting its install promise.
      - name: Stale-shell E2E (service-worker install + deploy skew)
        run: bun run test:shell

  # Runs the conversions rather than trusting the route graph. The graph
  # answers "is there a path", which has been true for pairs that then threw on
  # the real bytes: a handler that rejects the file, a format token that
  # resolves to a registry entry no user would pick, a buffer detached by an
  # earlier hop. This job converts one real sample per landing-page pair and
  # checks bytes come back.
  #
  # Separate from `build` so it runs alongside it instead of after: the whole
  # job is ~4 minutes, most of it apt. It does not need `bun run build` - the
  # script imports src directly and reads test/resources.
  #
  # The script exits 0 for pairs it can explain away (browser-only handler,
  # no sample to bootstrap from), so a red job here is a conversion that
  # actually broke.
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun i --frozen-lockfile

      # Not the `libreoffice` metapackage: writer, impress and calc are the
      # three the office pairs route through, and the metapackage pulls in
      # Base, Draw, Math and a JRE for no extra coverage. Without this the
      # office pairs report ENV and pass silently, which is the failure mode
      # this job exists to remove.
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-impress libreoffice-calc

      - name: Verify conversions
        run: bun run scripts/verify-conversions.ts

  # nginx has never actually parsed these files. `docker/nginx/headers.test.ts`
  # reads default.conf as text and checks a structural rule - every location
  # that adds a header of its own re-includes the security snippet - which is a
  # real regression guard but not a syntax check. A typo'd directive passes
  # that test, builds a clean image, publishes to GHCR on the next master push,
  # and fails only when someone starts a container.
  #
  # So hand the files to the same nginx the runtime stage runs, laid out where
  # docker/Dockerfile puts them. `nginx -t` opens the listening sockets as well
  # as parsing, so this also covers `listen [::]:80` being bindable.
  #
  # Its own job rather than a step in `build`: it needs no bun, no submodules
  # and no dist, so it has no reason to queue behind them.
  nginx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same tag as the Dockerfile runtime stage - keep the two in step.
      - name: Validate nginx config
        run: |
          docker run --rm \
            -v "$PWD/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            nginx:stable-alpine nginx -t

  # Measurement, not a gate on this PR's changes. #45: xlsx is pinned to a
  # tarball on cdn.sheetjs.com because SheetJS stopped publishing to npm after
  # 0.18.5, and 0.18.5 carries two high-severity advisories (GHSA-4r6h-8v6p-xvw6,
  # GHSA-5pgg-2g8v-p4x9) that our pinned 0.20.3 does not. A restricted network
  # cannot reach that CDN, and `bun install` exits 0 without the package, which
  # is what confines six suites to CI.
  #
  # `@e965/xlsx` republishes 0.20.3 to npm, so switching would be a one-line
  # fix - but it is a single-maintainer repack whose hash cannot be tied back
  # to the official tarball. This job answers whether it is the same code,
  # which is the fact that decides between mirroring ourselves and using it.
  #
  # Runs here because a GitHub runner has the open egress the CDN needs; every
  # `bun i` in this workflow already pulls that tarball successfully.
  xlsx-mirror-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compare the npm mirror against the official SheetJS tarball
        run: |
          set -euo pipefail

          # Derived from bun.lock rather than hardcoded, so a version bump does
          # not leave this auditing a tarball we no longer install.
          LOCK_LINE=$(grep '"xlsx": \["xlsx@https://cdn.sheetjs.com' bun.lock)
          OFFICIAL_URL=$(grep -o 'https://cdn\.sheetjs\.com[^"]*' <<<"$LOCK_LINE")
          EXPECTED=$(grep -o 'sha512-[A-Za-z0-9+/=]*' <<<"$LOCK_LINE")
          VERSION=$(sed -n 's#.*/xlsx-\([0-9.]*\)\.tgz#\1#p' <<<"$OFFICIAL_URL")
          MIRROR_URL="https://registry.npmjs.org/@e965/xlsx/-/xlsx-${VERSION}.tgz"

          echo "official : $OFFICIAL_URL"
          echo "mirror   : $MIRROR_URL"

          curl -sSfL --retry 3 -o official.tgz "$OFFICIAL_URL"
          curl -sSfL --retry 3 -o mirror.tgz   "$MIRROR_URL"

          # 1. Provenance. The tarball the CDN served today must be the one
          #    bun.lock pinned. A mismatch means the pin no longer describes
          #    what we install, which is a real problem regardless of #45.
          ACTUAL="sha512-$(openssl dgst -sha512 -binary official.tgz | base64 -w0)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::official tarball does not match the integrity hash in bun.lock"
            echo "  expected: $EXPECTED"
            echo "  actual  : $ACTUAL"
            exit 1
          fi
          echo "provenance OK - official tarball matches the bun.lock hash"

          mkdir -p a b && tar xzf official.tgz -C a && tar xzf mirror.tgz -C b

          # 2. Code. package.json is excluded and handled separately below:
          #    the mirror is published under a different name, so it always
          #    differs, and the two are formatted differently (tabs vs spaces)
          #    so a textual diff of them prints both files in full and buries
          #    everything else.
          if diff -r --exclude=package.json a/package b/package > delta.txt 2>&1; then
            CODE_VERDICT="IDENTICAL"
          else
            CODE_VERDICT="DIFFERENT"
          fi

          # 3. package.json, compared as parsed JSON so only real differences
          #    show rather than every reindented line.
          python3 - <<'PY' | tee pkg.txt
          import json
          a = json.load(open("a/package/package.json"))
          b = json.load(open("b/package/package.json"))
          diffs = [k for k in sorted(set(a) | set(b)) if a.get(k) != b.get(k)]
          print("package.json keys that differ: " + (", ".join(diffs) if diffs else "(none)"))
          for k in diffs:
              print(f"  {k}:")
              print(f"    official: {json.dumps(a.get(k))[:160]}")
              print(f"    mirror  : {json.dumps(b.get(k))[:160]}")
          PY

          {
            echo "## xlsx mirror audit ($VERSION)"
            echo
            echo "Official tarball matches the \`bun.lock\` integrity hash."
            echo
            if [ "$CODE_VERDICT" = "IDENTICAL" ]; then
              echo "**Code is identical.** Every file except \`package.json\` matches byte-for-byte."
            else
              echo "**Code differs.** First 40 lines:"
              echo '```'
              head -40 delta.txt
              echo '```'
            fi
            echo
            echo '```'
            cat pkg.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CODE_VERDICT" = "DIFFERENT" ]; then
            echo "--- code differences (first 40 lines) ---"
            head -40 delta.txt
          fi

          # Verdict last, so a tail of the log always ends on the answer rather
          # than on whatever diff output happened to precede it.
          echo
          echo "=================================================="
          echo "  provenance : OK (matches bun.lock)"
          echo "  code       : $CODE_VERDICT"
          echo "=================================================="
