name: Build Electron Distributions

on:
  push:
    branches: ["master"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and publish a GitHub Release for (e.g. v2.5.0)"
        required: true

# Least privilege by default; only the release job can write.
permissions:
  contents: read

env:
  # Pinned, so a Bun release cannot change what a release build is made with.
  # Keep in step with ci.yml.
  BUN_VERSION: "1.4.4"

jobs:
  # Fails a release before anything is published: the tag must match
  # package.json, the release notes and CHANGELOG must cover that version, and
  # CI must have passed on this exact commit. The release workflow builds
  # whatever commit it is handed and never ran the test suite itself, so a red
  # commit used to be one dispatch away from being published.
  preflight:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag, version and notes agree
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
          grep -q "^## What's new in $version\$" .github/RELEASE_NOTES.md \
            || { echo "::error::.github/RELEASE_NOTES.md has no \"## What's new in $version\" section."; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no [$version] section."; exit 1; }

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        # CI may still be running when a release is dispatched straight after a
        # merge, so wait for it rather than fail early (CI takes ~8 minutes).
        run: |
          for attempt in $(seq 1 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "none" else "\(.status) \(.conclusion) \(.html_url)" end')
            echo "CI on $SHA: $run"
            case "$run" in
              "completed success "*) exit 0 ;;
              completed*) echo "::error::CI did not pass on $SHA: $run"; exit 1 ;;
              none) [ "$attempt" -ge 6 ] && { echo "::error::No CI run on master for $SHA. Release only commits that went through master CI."; exit 1; } ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for CI on $SHA."
          exit 1

  build-electron:
    runs-on: ${{ matrix.os }}

    env:
      VITE_COMMIT_SHA: ${{ github.sha }}

    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            dist_cmd: bun run desktop:dist:linux
          - os: windows-2025
            platform: win
            dist_cmd: bun run desktop:dist:win
          - os: macos-15
            platform: mac
            dist_cmd: bun run desktop:build && bun x electron-builder --mac zip --publish never

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Build Distribution for ${{ matrix.platform }}
        env:
          # Vite can exhaust Node's default ~2 GB heap on macOS runners.
          NODE_OPTIONS: ${{ matrix.platform == 'mac' && '--max-old-space-size=4096' || '' }}
        run: ${{ matrix.dist_cmd }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: convert-desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.snap
            release/*.deb
          retention-days: 7

  # Publishes once every platform has built. The legs used to publish the
  # release themselves, so it went live and became "Latest" with only the
  # first platform's file attached: v3.2.0 was up with Linux alone for over
  # three minutes before macOS and Windows arrived. One job also means one
  # copy of the generated notes, which the per-leg version had to work around.
  release:
    needs: [preflight, build-electron]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: convert-desktop-*
          path: installers
          merge-multiple: true

      - name: One installer per platform
        run: |
          ls -la installers
          for pattern in '*.exe' '*.zip' '*.AppImage'; do
            count=$(find installers -maxdepth 1 -name "$pattern" | wc -l)
            [ "$count" -ge 1 ] || { echo "::error::No $pattern installer was built."; exit 1; }
          done

      # A re-run on a tag that is already published must not take it back to
      # draft: the release would vanish for everyone until the run finished.
      - name: New release or re-run
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          echo "Existing release for $TAG: $state"
          if [ "$state" = "false" ]; then echo "draft=false" >> "$GITHUB_OUTPUT"; else echo "draft=true" >> "$GITHUB_OUTPUT"; fi

      # Created as a draft with every file attached, then published in one
      # step, so nobody sees a half-uploaded release.
      - name: Create the release as a draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          # The hand-written half of the body; GitHub appends the generated PR
          # list below it.
          body_path: .github/RELEASE_NOTES.md
          generate_release_notes: true
          draft: ${{ steps.existing.outputs.draft }}
          # A re-run on the same tag replaces stale binaries instead of adding
          # duplicates side by side.
          overwrite_files: true

      - name: Publish and mark as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
