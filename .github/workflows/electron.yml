name: Build Electron Distributions

on:
  push:
    branches: ["master"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and publish a GitHub Release for (e.g. v2.5.0)"
        required: true

jobs:
  build-electron:
    runs-on: ${{ matrix.os }}

    env:
      VITE_COMMIT_SHA: ${{ github.sha }}

    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            dist_cmd: bun run desktop:dist:linux
          - os: windows-2025
            platform: win
            dist_cmd: bun run desktop:dist:win
          - os: macos-15
            platform: mac
            dist_cmd: bun run desktop:build && bun x electron-builder --mac zip --publish never

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Build Distribution for ${{ matrix.platform }}
        run: ${{ matrix.dist_cmd }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: convert-desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.snap
            release/*.deb
          retention-days: 7
      
      - name: Publish GitHub Release (if new tag)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, github.ref_name is the tag. On a manual
          # workflow_dispatch, take the tag from the input and create it at the
          # commit this run checked out (the tip of the dispatched ref).
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.snap
            release/*.deb
          # Publish straight away and re-target the GitHub "Latest" badge so the
          # rolling release tracks the newest tag without a manual click. Use
          # overwrite_files so a re-run on the same tag replaces stale binaries
          # rather than uploading duplicates side-by-side.
          # The hand-written half of the body. Without it the body is whatever
          # generate_release_notes produces, so recutting a tag silently
          # replaced the release notes with a bare "What's Changed" list.
          # GitHub appends the generated PR list below this.
          #
          # Pinned to the same single leg as generate_release_notes below, and
          # for a related reason: a body set on every leg races the generated
          # list. Whichever platform finishes last wins, so a mac or windows leg
          # landing after linux would rewrite the body to this file alone and
          # drop the PR list linux had just added. Empty is falsy to the action,
          # which then leaves the body untouched.
          body_path: ${{ matrix.platform == 'linux' && '.github/RELEASE_NOTES.md' || '' }}
          # One job, and only one, generates the notes.
          #
          # This step runs once per matrix leg, and each leg that asks for
          # generated notes APPENDS another copy to the release body rather
          # than replacing it. v3.0.0 shipped with "What's Changed" and its
          # changelog link printed three times over - once per platform - which
          # is the first thing anyone sees on the release page. Pinning it to a
          # single leg gives exactly one copy regardless of which platform
          # finishes first: whoever creates the release leaves the body alone,
          # and linux fills it in whenever it gets there.
          generate_release_notes: ${{ matrix.platform == 'linux' }}
          draft: false
          make_latest: "true"
          overwrite_files: true
