name: PR 101 actual preview screenshots
on:
  push:
    branches: ["chore/pr101-visual-qa"]
  workflow_dispatch:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun i --frozen-lockfile
      - name: Capture actual deployed preview
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          bun scripts/visual-qa-pr101.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr101-actual-desktop-mobile
          path: visual-qa-shots/*.png
          if-no-files-found: warn
          retention-days: 7
