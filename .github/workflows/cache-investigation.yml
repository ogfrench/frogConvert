name: Cache determinism investigation
on:
  pull_request:
    branches: [master]
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun i --frozen-lockfile
      - run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Generate twice, with a stale built cache on the second run
        shell: bash
        run: |
          bun run cache:build
          cp dist/cache.json "$RUNNER_TEMP/cache-first.json"
          printf '[]' > dist/cache.json
          bun run scripts/buildCache.js "$RUNNER_TEMP/cache-second.json" --minify
          node scripts/compareFormatCaches.mjs "$RUNNER_TEMP/cache-first.json" "$RUNNER_TEMP/cache-second.json"
      - name: Report fresh cache and capability differences
        shell: bash
        run: |
          node - "$RUNNER_TEMP/cache-first.json" <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const canonical = v => Array.isArray(v) ? v.map(canonical) : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canonical(v[k])])) : v;
          const hash = crypto.createHash('sha256').update(JSON.stringify(canonical(data))).digest('hex');
          console.log('ORDER', JSON.stringify(data.map(([name]) => name)));
          console.log('FINGERPRINT', hash);
          console.log('IMAGEMAGICK_JSON', JSON.stringify(data.find(([name]) => name === 'ImageMagick')[1]));
          NODE
