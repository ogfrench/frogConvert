name: AI plugin packages

on:
  pull_request:
    paths:
      - 'integrations/ai-plugins/**'
      - 'scripts/build-ai-plugins.py'
      - 'scripts/smoke-ai-mcp.py'
      - 'tests/test_ai_plugins.py'
      - 'package.json'
      - '.github/workflows/ai-plugins.yml'
      - 'docs/AI_PLUGINS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test plugin manifests, scripts, archives and checksums
        run: python3 -m unittest discover -s tests -p test_ai_plugins.py

  native-linux-probe:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install pinned Bun via npm
        run: |
          npm install -g bun@1.4.4
          bun --version
      - name: Install dependencies for native build
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck plugin integration
        run: bun x tsc --noEmit
      - name: Test output collision policy
        run: bun x vitest run src/mcp/core/fileInput.overwrite.test.ts
      - name: Compile native Linux MCP executable
        run: bun run compile:linux
      - name: Smoke-test MCP outside source repository
        run: python3 scripts/smoke-ai-mcp.py release/frogconvert-linux
      - name: Create native plugin archives
        run: python3 scripts/build-ai-plugins.py --target linux-x64 --binary release/frogconvert-linux --check
      - name: Upload validated Linux preview
        uses: actions/upload-artifact@v7
        with:
          name: frogconvert-ai-plugins-linux-preview
          path: dist/ai-plugins/*
          if-no-files-found: error

  native-cross-platform-probe:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            compile: compile:win
            binary: release/frogconvert-win.exe
          - os: macos-15
            target: macos-arm64
            compile: compile:mac
            binary: release/frogconvert-mac-arm64
          - os: macos-15-intel
            target: macos-x64
            compile: compile:mac:x64
            binary: release/frogconvert-mac-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Bun
        run: |
          npm install -g bun@1.4.4
          bun --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck plugin integration
        run: bun x tsc --noEmit
      - name: Compile native MCP executable
        run: bun run "${{ matrix.compile }}"
      - name: Smoke-test native MCP outside source checkout
        run: python scripts/smoke-ai-mcp.py "${{ matrix.binary }}"
      - name: Create and verify native preview archives
        run: python scripts/build-ai-plugins.py --target "${{ matrix.target }}" --binary "${{ matrix.binary }}" --check
      - name: Upload validated preview
        uses: actions/upload-artifact@v7
        with:
          name: frogconvert-ai-plugins-${{ matrix.target }}-preview
          path: dist/ai-plugins/*
          if-no-files-found: error
