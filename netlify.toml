[build]
  command = "bun run build"
  publish = "dist"

# Explicit 404 for reserved prefixes — avoids the SPA fallback masking
# missing API/well-known endpoints as 200 index.html responses.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.well-known/*"
  to = "/404.html"
  status = 404

# Build output MUST 404 when it is missing, never fall through to the SPA
# rule below. A hashed chunk from a previous deploy no longer exists here, so
# the catch-all answered it with 200 text/html - and the service worker then
# cached that HTML under the .js URL, poisoning it until the user cleared site
# data. A 404 is both honest and recoverable: the SW declines to cache it and
# the boot/preload handlers can react. Netlify matches real files before
# redirects, so present assets are unaffected.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/js/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wasm/*"
  to = "/404.html"
  status = 404

# Fallback for client-side routing - serves index.html for any path
# that doesn't match a real file in dist/ (matches nginx try_files behaviour).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # No Content-Security-Policy here on purpose. public/_headers carries it,
    # and the csp-hashes plugin stamps that file with a sha256 for every inline
    # script it finds in the built output, so the policy needs no
    # 'unsafe-inline'. netlify.toml takes precedence over _headers for the same
    # header on the same path, so declaring a CSP here silently shadowed the
    # hashed one: the strict policy was written, deployed and never applied.
    # A static toml cannot carry per-build hashes, which is why the real policy
    # lives in the file the build rewrites. docker/nginx/default.conf keeps the
    # permissive policy for the same reason: its conf is static too.

# Service worker must not be HTTP-cached so updates roll out promptly.
# Service-Worker-Allowed: / lets the SW be registered with root scope from any path.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# cache.json is the prebuilt format registry the app falls back to when it has
# no valid localStorage copy. It has no hash in its URL, so without an explicit
# rule a returning user can be served a stale registry from HTTP cache and see
# an out-of-date format list. Revalidate every time; it is one 153 KB request
# made once per build change.
[[headers]]
  for = "/cache.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Build output is content-hashed, so a given URL's bytes can never change and
# the browser never needs to revalidate it. Mirrors the /assets/ block in
# docker/nginx/default.conf.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# WASM blobs ship with content-stable URLs (vite-plugin-static-copy doesn't
# hash them). Long HTTP cache + 7-day SW cache means repeat conversions hit
# disk instantly while critical fixes still propagate within a week.
[[headers]]
  for = "/wasm/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Entry HTMLs MUST NOT be HTTP-cached — they reference hashed asset URLs
# that change every build. Caching the HTML pins users to old asset hashes
# and breaks the SW update flow.
# Generated static pages. The per-mode copies reference hashed asset URLs that
# change every build, and the landing pages are regenerated whenever the format
# registry moves, so none of them may be pinned in an HTTP cache. Deliberately
# scoped rather than a blanket /* rule, which would also stop /assets/* from
# being cached and defeat the hashing.
[[headers]]
  for = "/convert/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/compress/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/pdf/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/formats/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/docs/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/headless/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
