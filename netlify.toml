[build]
  command = "bun run build"
  publish = "dist"

# Explicit 404 for reserved prefixes — avoids the SPA fallback masking
# missing API/well-known endpoints as 200 index.html responses.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.well-known/*"
  to = "/404.html"
  status = 404

# Fallback for client-side routing - serves index.html for any path
# that doesn't match a real file in dist/ (matches nginx try_files behaviour).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Mirrors docker/nginx/default.conf:21 so the hosted build matches the
    # containerised deploy. 'unsafe-inline' is required by the FOUC-prevention
    # inline script in index.html, the async-CSS onload attribute, and the
    # onclick in UploadZone's string popup — all documented in nginx conf.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; object-src 'none'; frame-ancestors 'none';"
