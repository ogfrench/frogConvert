[build]
  command = "bun run build"
  publish = "dist"

# Fallback for client-side routing - serves index.html for any path
# that doesn't match a real file in dist/ (matches nginx try_files behaviour).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
