services:
  convert:
    build:
      context: ..
      # No VITE_COMMIT_SHA default here: it is honoured now, and a fixed string
      # is exactly the stamp that stops a rebuilt image from being recognised as
      # a new build. `bun run docker:build` passes the real SHA; without it this
      # dev image falls back to 'dev', which the docs footer renders as an
      # unlinked placeholder rather than a commit link that 404s.
      dockerfile: docker/Dockerfile
    image: convert:dev
