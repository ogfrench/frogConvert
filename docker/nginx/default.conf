server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # BOTH this include and the per-location ones below are required, and
    # neither is redundant. nginx's add_header does not merge across levels: a
    # location declaring any add_header of its own inherits none of these, so
    # every such location re-includes the snippet. This one covers the
    # locations that add no header and inherit normally - /favicon.ico, /js/
    # and the SPA fallback. Removing it strips the headers from those three.
    include /etc/nginx/snippets/security-headers.conf;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    # PWA service worker — must NOT be HTTP-cached so updates roll out promptly.
    # Service-Worker-Allowed: / lets it be registered with root scope from any path.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type "application/manifest+json" always;
        try_files $uri =404;
    }

    # WASM blobs ship with content-stable URLs; long HTTP cache + 7-day SW
    # cache means repeat conversions hit disk while critical fixes still
    # propagate within a week.
    location ~ ^/wasm/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Mirrors netlify.toml. cache.json is the prebuilt format registry served
    # when the app has no valid localStorage copy; it carries no hash in its
    # URL, so it must revalidate or returning users see a stale format list.
    location = /cache.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Entry HTMLs MUST NOT be HTTP-cached — they reference hashed asset URLs
    # that change every build. Caching the HTML pins users to old asset hashes.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /docs/index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /headless/index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Build output MUST 404 when it is missing, never fall through to the SPA
    # fallback below. A hashed chunk from a previous deploy is gone from this
    # root, and answering it with 200 index.html let the service worker cache
    # HTML under a .js URL, poisoning it until the user cleared site data.
    # Mirrors the /assets/*, /js/* and /wasm/* rules in netlify.toml.
    # This is the highest-request-count path in the app, and the full snippet is
    # ~450 bytes of header on every JS, CSS and font response - only nosniff is
    # meaningful on a subresource, the rest being document-level. It is included
    # whole anyway: the rule "a location that adds a header re-includes the
    # snippet" is one a reader can apply without judgement and a test can check,
    # and an exception here is exactly the shape of the bug this whole file is
    # fixing. HTTP/2 header compression makes the repeat cost negligible; on
    # HTTP/1.1 it is a real if small tax, taken deliberately.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /js/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
