server {
    listen 80;
    listen [::]:80;
    
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    # X-Frame-Options kept alongside frame-ancestors for older browser compat
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 'unsafe-inline' in script-src is required by three things that need refactoring to remove:
    #   1. The FOUC-prevention inline <script> in index.html
    #   2. The onload="..." attribute injected by the async-CSS transform in vite.config.js
    #   3. The onclick="window.hidePopup()" in UploadZone's string popup
    # 'unsafe-inline' in style-src is required by inline style= attributes on the bg-pop elements in index.html
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; object-src 'none'; frame-ancestors 'none';" always;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    # PWA service worker — must NOT be HTTP-cached so updates roll out promptly.
    # Service-Worker-Allowed: / lets it be registered with root scope from any path.
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json" always;
        try_files $uri =404;
    }

    # WASM blobs ship with content-stable URLs; long HTTP cache + 7-day SW
    # cache means repeat conversions hit disk while critical fixes still
    # propagate within a week.
    location ~ ^/wasm/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Entry HTMLs MUST NOT be HTTP-cached — they reference hashed asset URLs
    # that change every build. Caching the HTML pins users to old asset hashes.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /docs/index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /headless/index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
