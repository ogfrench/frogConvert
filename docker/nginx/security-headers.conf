# Security headers, in a snippet because nginx's add_header does not merge
# across configuration levels: a location that declares ANY add_header of its
# own silently drops every header inherited from the server block. Several
# locations here need their own Cache-Control, and each of those was therefore
# serving responses with none of these headers - including `location =
# /index.html`, which `location /`'s try_files lands on for every SPA
# navigation, so the app document itself shipped with no CSP at all.
#
# Included at server level and again in every location that adds a header of
# its own. Kept in /etc/nginx/snippets rather than /etc/nginx/conf.d because
# nginx auto-includes conf.d/*.conf into the http block.

add_header X-Content-Type-Options "nosniff" always;
# X-Frame-Options kept alongside frame-ancestors for older browser compat
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 'unsafe-inline' in script-src is required by three things that need refactoring to remove:
#   1. The FOUC-prevention inline <script> in index.html
#   2. The onload="..." attribute injected by the async-CSS transform in vite.config.js
#   3. The onclick="window.hidePopup()" in UploadZone's string popup
# 'unsafe-inline' in style-src is required by inline style= attributes on the bg-pop elements in index.html
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; object-src 'none'; frame-ancestors 'none';" always;
